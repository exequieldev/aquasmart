{% extends 'base.html' %}

{% block title %}AquaSmart - Iniciar Sesión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="glass-card rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-blue-500 rounded-xl flex items-center justify-center shadow-lg mx-auto mb-3">
                <i class="fas fa-user-lock text-white text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Iniciar Sesión</h2>
            <p class="text-sm text-gray-500">Ingresa tus credenciales en AquaSmart</p>
        </div>

        {% if form.errors %}
        <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
            Usuario o contraseña incorrectos. Por favor, intenta de nuevo.
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
                <input type="text" name="username" id="id_username" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-700 hover:to-blue-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md">
                Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
